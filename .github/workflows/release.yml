# Publica un release de GitHub con el binario compilado para 5 plataformas.
#
# Todo ocurre dentro de GitHub Actions: no hay servicios externos ni secretos que
# configurar. `github.token` es el token AUTOMÁTICO que GitHub inyecta en cada run
# (vive solo durante el job, con alcance limitado a este repo/run), por lo que no
# hay que crear un PAT ni añadir nada en Settings → Secrets. El permiso necesario
# es `contents: write`, declarado más abajo.

name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            label: linux-x64
            ext: tar.gz
          - target: bun-linux-arm64
            label: linux-arm64
            ext: tar.gz
          - target: bun-darwin-arm64
            label: darwin-arm64
            ext: tar.gz
          - target: bun-darwin-x64
            label: darwin-x64
            ext: tar.gz
          - target: bun-windows-x64
            label: windows-x64
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Los flags se anexan al final del script, así que caen sobre
      # `bun build` (y no sobre `bun test`). Los tests siguen ejecutándose.
      - name: Build
        run: bun run build --target=${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # Bun nombra la salida según el SO: `weather.exe` en targets Windows y
          # `weather` en el resto. No se asume el nombre, se comprueba.
          src_bin=""
          for candidate in weather weather.exe; do
            if [ -f "$candidate" ]; then
              src_bin="$candidate"
              break
            fi
          done
          if [ -z "$src_bin" ]; then
            echo "::error::No se encontró el binario compilado (weather / weather.exe)"
            ls -la
            exit 1
          fi

          if [ "${{ matrix.label }}" = "windows-x64" ]; then
            bin="weather-windows-x64.exe"
          else
            bin="weather-${{ matrix.label }}"
          fi
          mv "$src_bin" "dist/$bin"

          # Se empaqueta por nombre (no el directorio) para que el archivo
          # resultante no intente contenerse a sí mismo.
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && zip "weather-${{ matrix.label }}.zip" "$bin")
          else
            tar -czf "dist/weather-${{ matrix.label }}.tar.gz" -C dist "$bin"
          fi
          rm -f "dist/$bin"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.label }}
          path: dist/weather-${{ matrix.label }}.*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Resolve tag from package.json
        id: version
        run: |
          version="$(jq -r '.version // empty' package.json)"
          if [ -z "$version" ]; then
            echo "::error::package.json no tiene campo 'version'"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Publicando el release v$version"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::El release $TAG ya existe, no se hace nada."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksums and publish
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
          # gh crea el tag en $TARGET si aún no existe
          gh release create "$TAG" ./* \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes \
            --latest
